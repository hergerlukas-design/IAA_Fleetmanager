name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      org:
        description: "Fly.io org slug (used only when the app must be created)"
        default: "personal"
        required: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Ohne FLY_API_TOKEN wird der Deploy übersprungen (grüner Lauf statt Fehler),
      # damit ein Push vor dem Setzen der Secrets nicht rot wird.
      - name: Check for Fly token
        id: guard
        run: |
          if [ -z "${{ secrets.FLY_API_TOKEN }}" ]; then
            echo "::notice::FLY_API_TOKEN ist nicht gesetzt – Deploy wird übersprungen."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.guard.outputs.ready == 'true'

      # Legt die Fly-App beim ersten Lauf an; existiert sie bereits, ist der Schritt
      # ein No-Op. Erfordert einen org-scoped FLY_API_TOKEN.
      - name: Ensure Fly app exists
        if: steps.guard.outputs.ready == 'true'
        run: |
          flyctl apps create iaa-fleetmanager \
            --org "${{ github.event.inputs.org || 'personal' }}" || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        run: |
          flyctl deploy --remote-only \
            --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} \
            --build-arg VITE_SUPABASE_KEY=${{ secrets.VITE_SUPABASE_KEY }} \
            --build-arg VITE_ADMIN_PIN=${{ secrets.VITE_ADMIN_PIN }} \
            --build-arg VITE_APP_PASSWORD=${{ secrets.VITE_APP_PASSWORD }} \
            --build-arg VITE_APP_SECRET=${{ secrets.VITE_APP_SECRET }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
